[versions]
# api — update conservatively (security/bugs only)
jspecify = "1.0.0"

# provided — compileOnly, supplied by the consumer's build at run time. The published check and
# plugin are binary-coupled to these, so update conservatively and move README's "built against"
# line with them. The build section's unsuffixed versions of the same coordinates run this
# repository's own linting, so a current Error Prone exercises the check built against the target.
errorprone-target = "2.50.0"
errorprone-plugin-target = "5.1.0"

# implementation — keep current
jline = "4.4.6"
slf4j = "2.0.18"

# test — always latest
junit = "6.1.2"

# build — keep current
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
gitchangelog-plugin = "3.1.2"
nmcp = "1.6.1"
spotless = "8.9.0"

[libraries]
errorprone-check-api = { module = "com.google.errorprone:error_prone_check_api", version.ref = "errorprone-target" }
# error_prone_core appears twice on purpose: errorprone-core runs this repository's own linting,
# errorprone-core-target runs ConcordanceTest against the version the check promises. They never
# share a configuration.
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
errorprone-core-target = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-target" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin-target" }
errorprone-test-helpers = { module = "com.google.errorprone:error_prone_test_helpers", version.ref = "errorprone-target" }
jline = { module = "org.jline:jline", version.ref = "jline" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
gitchangelog = { id = "se.bjurr.gitchangelog.git-changelog-gradle-plugin", version.ref = "gitchangelog-plugin" }
nmcp-aggregation = { id = "com.gradleup.nmcp.aggregation", version.ref = "nmcp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
