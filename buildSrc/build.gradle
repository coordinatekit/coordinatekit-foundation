// Compiles the changelog-gradle module's sources so that this repository applies the plugin as it
// stands in the working tree rather than as last released: a release pull request regenerates
// CHANGELOG.md, and it has to do so with the template that pull request ships. The sources stay in
// the real module, where Spotless, Error Prone, and the tests still check them; this build only
// compiles a second copy and registers the same plugin id.
plugins {
    id "java-gradle-plugin"
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

sourceSets {
    main {
        java.srcDir "../changelog-gradle/src/main/java"
        resources.srcDir "../changelog-gradle/src/main/resources"
    }
}

gradlePlugin {
    plugins {
        changelog {
            id = "org.coordinatekit.foundation.changelog"
            implementationClass = "org.coordinatekit.foundation.changelog.gradle.ChangelogPlugin"
        }
    }
}

dependencies {
    implementation libs.gitchangelog.gradle.plugin
    compileOnly libs.jspecify
}
