import net.ltgt.gradle.errorprone.CheckSeverity
import groovy.xml.XmlSlurper
import org.coordinatekit.foundation.aggregate.javadoc.gradle.AggregateJavadocPlugin
import org.coordinatekit.foundation.version.references.gradle.VersionReferencesPlugin

plugins {
    alias(libs.plugins.spotless)
    alias(libs.plugins.errorprone)
    id "jacoco"
    id "jacoco-report-aggregation"
    id "java-library"
    alias(libs.plugins.nmcp.aggregation)
    alias(libs.plugins.release)
    id "org.coordinatekit.foundation.changelog"
}

allprojects {
    group = "org.coordinatekit.foundation"

    // The root project needs these too: `aggregateJacocoReport` resolves JaCoCo's Ant tasks and every
    // aggregated module's dependencies against them.
    repositories {
        mavenCentral()
    }
}

// `conventions` publishes two Spotless configuration files rather than code. It takes the jar and
// formatting wiring every subproject shares, and none of the compile, test, or coverage setup that
// only makes sense for a module with sources.
def codeProjects = subprojects.findAll { it.name != "conventions" }

// Modules that publish a Gradle plugin. `java-gradle-plugin` creates their `pluginMaven` publication
// from `components.java`, so they must not also get the `centralPortal` publication every other
// module gets, or the same jar would ship twice under one coordinate.
def pluginProjects = [
        project(":aggregate-javadoc-gradle"),
        project(":changelog-gradle"),
        project(":concordance-gradle"),
        project(":third-party-licenses-gradle"),
        project(":version-references-gradle")
]

// Signing is required only when a deployment is actually going to Central. `./gradlew build`,
// `publishToMavenLocal`, and snapshot uploads all run without a key. The answer is settled once the
// task graph is, and held in a property: the configuration cache stores it with the graph, whereas
// asking the graph again from a signing task at execution time is not allowed.
def isPublishingToCentral = objects.property(Boolean).convention(false)
gradle.taskGraph.whenReady { graph ->
    isPublishingToCentral.set(graph.allTasks.any { it.name == "nmcpPublishAggregationToCentralPortal" })
}

subprojects {
    apply plugin: "com.diffplug.spotless"
    apply plugin: "java-library"
    apply plugin: "maven-publish"
    apply plugin: "signing"
    apply plugin: "com.gradleup.nmcp"

    java {
        withJavadocJar()
        withSourcesJar()
    }

    // The subproject's own build.gradle has not been evaluated yet when this block runs, so the
    // description has to be read through a provider that resolves at POM-generation time.
    def moduleDescription = provider { project.description }

    publishing {
        publications {
            if (!pluginProjects.contains(project)) {
                centralPortal(MavenPublication) {
                    from components.java
                }
            }
        }

        // Applied to every publication rather than to `centralPortal` by name, so that a plugin
        // module's `pluginMaven` publication and its marker both carry it. Central validates the
        // marker POM by the same rules as any other.
        publications.withType(MavenPublication).configureEach {
            pom {
                name = "CoordinateKit Foundation ${project.name}"
                description = moduleDescription
                url = findProperty("repoUrl")

                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }

                developers {
                    developer {
                        id = "andymarek"
                        name = "Andy Marek"
                        email = "andy@andymarek.com"
                    }
                }

                scm {
                    connection = "scm:git:git://github.com/coordinatekit/coordinatekit-foundation.git"
                    developerConnection = "scm:git:ssh://github.com/coordinatekit/coordinatekit-foundation.git"
                    url = findProperty("repoUrl")
                }
            }
        }
    }

    // Central rejects a deployment whose POM is missing a required element, and the late-resolving
    // description would surface as an empty one rather than a build failure. `check` fails here
    // instead, for every generated POM, plugin markers included.
    def modulePath = project.path
    def pomTasks = tasks.withType(GenerateMavenPom)
    def pomFiles = files({ pomTasks.collect { it.destination } }).builtBy(pomTasks)

    tasks.register("validatePom") {
        description = "Verify every generated POM carries the metadata Maven Central requires"
        group = "verification"

        inputs.files(pomFiles)

        doLast {
            pomFiles.each { pomFile ->
                // Not namespace-aware: the POM declares a default xmlns, and matching bare local
                // names keeps the lookups readable.
                def pom = new XmlSlurper(false, false).parse(pomFile)
                def missing = []
                def require = { String element, String value -> if (!value?.trim()) missing << element }

                require("groupId", pom.groupId.text())
                require("artifactId", pom.artifactId.text())
                require("version", pom.version.text())
                require("name", pom.name.text())
                require("description", pom.description.text())
                require("url", pom.url.text())
                require("licenses/license/name", pom.licenses.license.name.text())
                require("licenses/license/url", pom.licenses.license.url.text())
                require("developers/developer/name", pom.developers.developer.name.text())
                require("scm/url", pom.scm.url.text())
                require("scm/connection", pom.scm.connection.text())

                if (missing) {
                    throw new GradleException(
                            "${modulePath} POM is missing metadata Maven Central requires: ${missing.join(', ')} " +
                            "(see ${pomFile})")
                }
            }
        }
    }

    tasks.named("check") {
        dependsOn tasks.named("validatePom")
    }

    signing {
        String signingKey = findProperty("signingKey")
        String signingPassword = findProperty("signingPassword")
        if (signingKey) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        } else {
            useGpgCmd()
        }
    }

    // Every publication is signed, for the same reason every POM is validated. `configureEach` also
    // covers publications registered later, such as the ones `java-gradle-plugin` creates in its own
    // `afterEvaluate`, so nothing here depends on which callback runs first.
    publishing.publications.configureEach {
        signing.sign(it)
    }

    tasks.withType(Sign).configureEach {
        onlyIf { isPublishingToCentral.get() }
    }

    // The files are read from conventions' sources by path rather than from its published jar, so
    // the build never depends on its own artifact. Consumers use the jar.
    spotless {
        java {
            eclipse("4.21").configFile(rootProject.file("conventions/src/main/resources/org/coordinatekit/foundation/conventions/eclipse_java_coordinatekit.xml"))
            licenseHeaderFile rootProject.file("conventions/src/main/resources/org/coordinatekit/foundation/conventions/license_header.txt")
            target "src/**/*.java"
            trimTrailingWhitespace()
            toggleOffOn()
        }
    }
}

configure(codeProjects) {
    apply plugin: "jacoco"
    apply plugin: "net.ltgt.errorprone"

    dependencies {
        errorprone rootProject.libs.errorprone.core

        api rootProject.libs.jspecify

        testImplementation(platform(rootProject.libs.junit.bom))
        testImplementation(rootProject.libs.junit.jupiter)
        testRuntimeOnly(rootProject.libs.junit.platform.launcher)
    }

    // Stamped on every module's jar rather than only on the one that reads it: it costs nothing,
    // and `concordance-gradle` resolves its own version from here through
    // `Package.getImplementationVersion()` so the plugin and the check it configures always come
    // from the same release.
    tasks.named("jar", Jar) {
        manifest {
            attributes("Implementation-Version": project.version)
        }
    }

    test {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        reports {
            xml.required = true
        }
    }
}

// These three plugin modules build on a plugin that publishes only to the Gradle Plugin Portal. The
// portal is added to them alone so that nothing else resolves through its own mirror of Central.
configure([project(":changelog-gradle"), project(":concordance-gradle"), project(":third-party-licenses-gradle")]) {
    repositories {
        gradlePluginPortal()
    }
}

configure(pluginProjects) {
    apply plugin: "java-gradle-plugin"

    // Every plugin module tests against real Gradle builds through TestKit, so they share the
    // fixture wiring below.
    //
    // The functional tests' fixture builds run in TestKit daemons, out of reach of the test JVM's
    // JaCoCo agent, and an agent added to the daemon records nothing either: Gradle rewrites a build
    // script's classpath jars and loads its rewritten copy, so the classes an agent instruments are
    // not the ones that run. The fixture builds get a copy of the jar JaCoCo has instrumented
    // offline instead. Gradle's rewrite keeps the probes, and each class carries the ID of its
    // original, so the module's report matches the fixture data against its own classes.
    //
    // The runtime those probes call goes on the daemon's boot classpath rather than beside the
    // plugin, because Gradle closes the build script's classloader before the daemon exits, and a
    // runtime loaded there can no longer load the classes it writes its data with. Each module's
    // writeFixture passes these arguments on through the fixture's gradle.properties.
    configurations {
        testKitJacocoRuntime {
            canBeConsumed = false
            transitive = false
        }
    }

    dependencies {
        testKitJacocoRuntime "org.jacoco:org.jacoco.agent:${jacoco.toolVersion}:runtime"
    }

    def fixtureExecutionData = layout.buildDirectory.file("jacoco/fixture.exec")
    def testKitJarDirectory = layout.buildDirectory.dir("jacoco/testKit")
    def instrumentTestKitJar = tasks.register("instrumentTestKitJar") {
        def jar = tasks.named("jar", Jar).flatMap { it.archiveFile }
        def jacocoAnt = configurations.jacocoAnt
        inputs.file(jar).withPropertyName("jar")
        outputs.dir(testKitJarDirectory).withPropertyName("instrumentedJar")
        doLast {
            def destination = testKitJarDirectory.get().asFile
            // A version bump renames the jar, and a stale one would stay on the plugin classpath.
            destination.deleteDir()
            ant.taskdef(name: "jacocoInstrument", classname: "org.jacoco.ant.InstrumentTask",
                    classpath: jacocoAnt.asPath)
            ant.jacocoInstrument(destdir: destination) {
                fileset(file: jar.get().asFile)
            }
        }
    }

    tasks.named("test", Test) {
        def runtime = configurations.testKitJacocoRuntime
        inputs.files(runtime).withPropertyName("testKitJacocoRuntime")
        outputs.file(fixtureExecutionData).withPropertyName("fixtureExecutionData")
        doFirst { fixtureExecutionData.get().asFile.delete() }
        jvmArgumentProviders.add({
            ["-DtestKit.fixtureJvmArgs=-Xbootclasspath/a:${runtime.singleFile} -Djacoco-agent.destfile=${fixtureExecutionData.get().asFile}" as String]
        } as CommandLineArgumentProvider)

        // A build that git starts, as the pre-commit hook's check does, inherits GIT_DIR,
        // GIT_INDEX_FILE, and their kin, and JGit reads them in place of the directory it is given.
        // ChangelogPluginTest's fixture repository would then stage and commit into this repository's
        // own index, and the TestKit daemons, which inherit the test JVM's environment, would read
        // its history. Stripped at execution so a reused configuration cache entry cannot carry them.
        doFirst { task ->
            task.environment = task.environment.findAll { !it.key.startsWith("GIT_") }
        }
    }

    tasks.withType(JacocoReport).configureEach {
        executionData.from(fixtureExecutionData)
    }

    // The root's aggregateJacocoReport does not read this module's reports. It resolves the coverage
    // variant the jacoco plugin publishes for the `test` suite, which carries only test.exec, so the
    // fixture data joins that variant too.
    configurations.matching { it.name == "coverageDataElementsForTest" }.configureEach {
        outgoing.artifact(fixtureExecutionData) {
            type = "binary"
            builtBy tasks.named("test")
        }
    }

    // TestKit's withPluginClasspath() defaults to the plugin's class directories, and a directory
    // carries no jar manifest. Some plugins read their own version out of one, so the functional
    // test gets the instrumented jar instead, whose manifest is the published jar's, and exercises
    // the same path a published plugin takes. It is also the jar whose probes record the fixture
    // coverage, so every plugin module needs it, not only the ones that read their manifest.
    tasks.named("pluginUnderTestMetadata", org.gradle.plugin.devel.tasks.PluginUnderTestMetadata) {
        def instrumentedJar = files(testKitJarDirectory.map { it.asFileTree.matching { include "*.jar" } }) {
            builtBy instrumentTestKitJar
        }
        pluginClasspath.setFrom(instrumentedJar, configurations.runtimeClasspath)
    }
}

configure(project(":concordance-gradle")) {
    // The functional test's fixture build resolves the check from a flatDir repository rather than
    // from Maven Central, so it needs that module's jar built and needs to be told where it and the
    // versions the fixture pins came from. The jar is declared as an input, not just an ordering
    // edge, so a change to the check re-runs the test instead of leaving it UP-TO-DATE.
    tasks.named("test", Test) {
        inputs.files(project(":concordance-errorprone").tasks.named("jar", Jar).flatMap { it.archiveFile })
                .withPropertyName("concordanceCheckJar")
        systemProperty "concordance.checkJarDirectory",
                project(":concordance-errorprone").layout.buildDirectory.dir("libs").get().asFile.absolutePath
        systemProperty "concordance.errorProneVersion", rootProject.libs.versions.errorprone.target.get()
        systemProperty "concordance.errorPronePluginVersion", rootProject.libs.versions.errorprone.plugin.target.get()
    }
}

configure(project(":version-references-gradle")) {
    // The tests that rewrite this repository's own README and RELEASE.md need to know what a rewrite
    // would be anchored to, and the Gradle model already says: the group every project shares, the
    // root project's name, and the subproject names. They arrive as system properties so that no test
    // source carries a literal that a release would then have to chase. The files are declared as
    // inputs, so editing a doc re-runs the test instead of leaving it UP-TO-DATE.
    tasks.named("test", Test) {
        def root = rootProject
        inputs.files(root.file("README.md"), root.file("RELEASE.md"))
                .withPropertyName("repositoryDocs")
        systemProperty "versionReferences.repositoryRoot", root.projectDir.absolutePath
        systemProperty "versionReferences.group", root.group.toString()
        systemProperty "versionReferences.rootName", root.name
        systemProperty "versionReferences.modules", root.subprojects*.name.sort().join(",")
    }
}

// `conventions` publishes two resources and no classes, so javadoc exits with "No public or
// protected classes found to document" and would fail `build`. Its javadoc jar is empty by
// necessity; Central only requires that one exist. Every other module keeps javadoc's error
// reporting.
project(":conventions") {
    javadoc {
        failOnError = false
    }
}

// An Error Prone check is written against javac's own AST and symbol tables, which the jdk.compiler
// module does not export. Every other module compiles and documents without these; concordance-
// errorprone does neither with them missing, and its tests run javac in-process through
// CompilationTestHelper, so the same packages have to be open to the test JVM as well.
// aggregateJavadoc reads that module's sources too, which is why the list lives out here.
def javacExports = [
        "com.sun.tools.javac.api",
        "com.sun.tools.javac.code",
        "com.sun.tools.javac.comp",
        "com.sun.tools.javac.file",
        "com.sun.tools.javac.main",
        "com.sun.tools.javac.model",
        "com.sun.tools.javac.parser",
        "com.sun.tools.javac.processing",
        "com.sun.tools.javac.tree",
        "com.sun.tools.javac.util"
].collect { "jdk.compiler/${it}=ALL-UNNAMED" as String }

// Dogfooding: this repository's sources are checked against the rule its own AGENTS.md states, by
// the check in this repository rather than by a published release of it. The wiring is the raw
// -Xep flags rather than the concordance-gradle plugin, because that plugin resolves the check from
// Maven Central at its own version, which is the last release and not the working tree.
// concordance-errorprone's main sources are left out: nothing can supply the check that compiles it.
// Its test sources are in, checked by the module's own main output, which exists by then.
def concordanceFlags = { JavaCompile task ->
    task.options.errorprone.check("Concordance", CheckSeverity.ERROR)
    task.options.errorprone.option("Concordance:ScaffoldingFieldTypes", "org.slf4j.Logger")
    task.options.errorprone.option("Concordance:LifecycleAnnotations", [
            "org.junit.jupiter.api.AfterAll",
            "org.junit.jupiter.api.AfterEach",
            "org.junit.jupiter.api.BeforeAll",
            "org.junit.jupiter.api.BeforeEach"
    ].join(","))
}

configure(codeProjects.findAll { it.name != "concordance-errorprone" }) {
    dependencies {
        errorprone project(":concordance-errorprone")
    }

    tasks.withType(JavaCompile).configureEach(concordanceFlags)
}

project(":concordance-errorprone") {
    dependencies {
        testAnnotationProcessor sourceSets.main.output
    }

    tasks.named("compileTestJava", JavaCompile, concordanceFlags)

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += javacExports.collect { "--add-exports=${it}" as String }
    }

    javadoc {
        options.addMultilineStringsOption("-add-exports").value = javacExports
    }

    tasks.named("test", Test) {
        jvmArgs += javacExports.collect { "--add-exports=${it}" as String }
        jvmArgs += ["com.sun.tools.javac.code", "com.sun.tools.javac.comp"]
                .collect { "--add-opens=jdk.compiler/${it}=ALL-UNNAMED" as String }
    }
}

// One deployment, not one per module: nmcp collects every module's publication into a single
// bundle and uploads it once, so Central validates and publishes every module as a unit.
nmcpAggregation {
    centralPortal {
        username = findProperty("centralPortalUsername")
        password = findProperty("centralPortalPassword")
        publishingType = "AUTOMATIC"
    }
}

dependencies {
    subprojects.each {
        nmcpAggregation project(it.path)
    }
}

apply plugin: AggregateJavadocPlugin
apply plugin: VersionReferencesPlugin

// One coverage report over every module's `test` suite, from Gradle's own jacoco-report-aggregation
// plugin. Foundation has no plugin of its own for this on purpose: Gradle's already does the job,
// and one that duplicated it was removed. Each module is a jacocoAggregation dependency rather than
// a reach into its tasks, and the report keeps the name CI reads its XML by. The dependencies are
// not transitive: every module is listed anyway, and resolving theirs would need the Gradle Plugin
// Portal, which the root project stays off.
dependencies {
    codeProjects.each {
        jacocoAggregation(project(it.path)) {
            transitive = false
        }
    }
}

reporting {
    reports {
        aggregateJacocoReport(JacocoCoverageReport) {
            testSuiteName = "test"
        }
    }
}

aggregateJavadoc {
    projects = codeProjects
    title = "CoordinateKit Foundation"
    links = ["https://docs.oracle.com/en/java/javase/21/docs/api/", "https://jspecify.dev/docs/api/"]
    // Name segments whose display form is not just the segment capitalised.
    wordForms = ["api": "API", "cli": "CLI", "errorprone": "Error Prone"]
}

tasks.named("aggregateJavadoc", Javadoc) {
    options.addMultilineStringsOption("-add-exports").value = javacExports
}

// The plugin's own test fixtures carry version literals that are test data, not references to this
// project's version.
foundationVersionReferences {
    exclude "version-references-gradle/src/test/**"
}

// gradle-release passes the version being released into its nested builds, so the commits above the
// last tag render under it before its tag exists.
foundationChangelog {
    releaseVersion = providers.gradleProperty("release.releaseVersion")
}

release {
    tagTemplate = 'v$version'
    preTagCommitMessage = "chore: release"
    tagCommitMessage = "release"
    newVersionCommitMessage = "chore: start"
    buildTasks = ["check", "aggregateJavadoc", "gitChangelog"]
    git {
        pushToRemote = false
    }
}

// The documents are rewritten ahead of the build that checks and publishes them, so the commit that
// gradle-release makes carries them along with gradle.properties and CHANGELOG.md.
tasks.named("beforeReleaseBuild") {
    dependsOn tasks.named("rewriteVersionReferences")
}
