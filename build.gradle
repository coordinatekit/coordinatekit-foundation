import net.ltgt.gradle.errorprone.CheckSeverity
import com.github.jknack.handlebars.Helper
import groovy.xml.XmlSlurper
import se.bjurr.gitchangelog.internal.semantic.ConventionalCommitParser
import se.bjurr.gitchangelog.plugin.gradle.HelperParam

plugins {
    alias(libs.plugins.spotless)
    alias(libs.plugins.errorprone)
    id "jacoco"
    id "java-library"
    alias(libs.plugins.gitchangelog)
    alias(libs.plugins.nmcp.aggregation)
}

allprojects {
    group = "org.coordinatekit.foundation"

    // The root project needs these too: `aggregateJacocoReport` resolves JaCoCo's Ant tasks against
    // them.
    repositories {
        mavenCentral()
    }
}

gitChangelog {
    templateContent.set(project.file(".infra/changelog.hbs").text)
    dateFormat.set("yyyy-MM-dd")
    file.set(project.file("CHANGELOG.md"))

    // Squash-merged commits carry a trailing "(#NN)" pointing at their pull request. `description`
    // renders the conventional-commit description with that reference removed, and `pullRequest`
    // extracts the number so the template can link to the PR (falling back to the commit hash when
    // a commit landed without one).
    handlebarsHelpers.add(new HelperParam("description", { commit, options ->
        ConventionalCommitParser.commitDescription(commit.message).replaceAll(/\s*\(#\d+\)$/, "").trim()
    } as Helper))
    handlebarsHelpers.add(new HelperParam("pullRequest", { commit, options ->
        def matcher = commit.message =~ /\(#(\d+)\)/
        matcher.find() ? matcher.group(1) : ""
    } as Helper))

    // A deprecation warns about a removal one or more releases before the break, so it rides along
    // with the commit that supersedes the API instead of earning a commit type of its own, and is
    // marked with a `DEPRECATED:` footer on that commit. git-changelog-lib has no predicate for
    // "carries this footer", so these two supply the pair the template needs, mirroring the built-in
    // `ifContainsBreaking` and `ifCommitBreaking`.
    def deprecates = { message ->
        ConventionalCommitParser.getMessageParts(message as String)?.footers?.any {
            it.token.equalsIgnoreCase("DEPRECATED")
        } ?: false
    }
    handlebarsHelpers.add(new HelperParam("ifContainsDeprecated", { commits, options ->
        commits.any { deprecates(it.message) } ? options.fn() : options.inverse()
    } as Helper))
    handlebarsHelpers.add(new HelperParam("ifCommitDeprecated", { commit, options ->
        deprecates(commit.message) ? options.fn() : options.inverse()
    } as Helper))
}

tasks.named('gitChangelog') {
    doLast {
        def changelog = file("CHANGELOG.md")
        changelog.text = changelog.text.replace('__REPO_URL__', (findProperty('repoUrl') ?: '') as String)
    }
}

// `conventions` publishes two Spotless configuration files rather than code. It takes the jar and
// formatting wiring every subproject shares, and none of the compile, test, or coverage setup that
// only makes sense for a module with sources.
def codeProjects = subprojects.findAll { it.name != "conventions" }

// Modules that publish a Gradle plugin. `java-gradle-plugin` is applied from here, ahead of the
// `subprojects` block, because the publishing wiring below branches on whether a module has it: the
// plugin creates its own `pluginMaven` publication from `components.java`, so a module carrying it
// must not also get the `centralPortal` publication every other module gets, or the same jar would
// ship twice under one coordinate.
def pluginProjects = [project(":concordance-gradle")]

configure(pluginProjects) {
    apply plugin: "java-gradle-plugin"

    // net.ltgt.gradle:gradle-errorprone-plugin publishes to the Gradle Plugin Portal and not to
    // Maven Central, so reaching its ErrorProneOptions type needs the portal as a repository. It is
    // added here rather than to allprojects so that nothing else resolves through the portal's own
    // mirror of Central, and it never reaches a consumer: the dependency is compileOnly, so it does
    // not appear in the published POM.
    repositories {
        gradlePluginPortal()
    }

    // TestKit's withPluginClasspath() defaults to the plugin's class directories, and a directory
    // carries no jar manifest. The plugin reads its own version out of one, so the functional test
    // gets the jar instead and exercises the same path a published plugin takes.
    tasks.named("pluginUnderTestMetadata", org.gradle.plugin.devel.tasks.PluginUnderTestMetadata) {
        pluginClasspath.setFrom(tasks.named("jar"), configurations.runtimeClasspath)
    }

    // The functional test's fixture build resolves the check from a flatDir repository rather than
    // from Maven Central, so it needs that module's jar built and needs to be told where it and the
    // versions the fixture pins came from. The jar is declared as an input, not just an ordering
    // edge, so a change to the check re-runs the test instead of leaving it UP-TO-DATE.
    tasks.named("test", Test) {
        inputs.files(project(":concordance-errorprone").tasks.named("jar")).withPropertyName("concordanceCheckJar")
        systemProperty "concordance.checkJarDirectory",
                project(":concordance-errorprone").layout.buildDirectory.dir("libs").get().asFile.absolutePath
        systemProperty "concordance.errorProneVersion", libs.versions.errorprone.target.get()
        systemProperty "concordance.errorPronePluginVersion", libs.versions.errorprone.plugin.target.get()
    }
}

// Signing is required only when a deployment is actually going to Central. `./gradlew build`,
// `publishToMavenLocal`, and snapshot uploads all run without a key.
def isPublishingToCentral = { gradle.taskGraph.allTasks.any { it.name == "nmcpPublishAggregationToCentralPortal" } }

// One deployment, not one per module: nmcp collects every module's publication into a single
// bundle and uploads it once, so Central validates and publishes every module as a unit. A module
// added to settings.gradle has to be listed here too or it silently ships nothing.
nmcpAggregation {
    centralPortal {
        username = findProperty("centralPortalUsername")
        password = findProperty("centralPortalPassword")
        publishingType = "AUTOMATIC"
    }
}

dependencies {
    nmcpAggregation project(":cli-brand")
    nmcpAggregation project(":concordance")
    nmcpAggregation project(":concordance-errorprone")
    nmcpAggregation project(":concordance-gradle")
    nmcpAggregation project(":conventions")
}

subprojects {
    apply plugin: "com.diffplug.spotless"
    apply plugin: "java-library"
    apply plugin: "maven-publish"
    apply plugin: "signing"
    apply plugin: "com.gradleup.nmcp"

    java {
        withJavadocJar()
        withSourcesJar()
    }

    // The subproject's own build.gradle has not been evaluated yet when this block runs, so the
    // description has to be read through a provider that resolves at POM-generation time.
    def moduleDescription = provider { project.description }

    publishing {
        publications {
            // A plugin module already has a publication of `components.java`, created for it by
            // `java-gradle-plugin`, so registering a second one here would publish its jar twice.
            if (!pluginProjects.contains(project)) {
                centralPortal(MavenPublication) {
                    from components.java
                }
            }
        }

        // Applied to every publication rather than to `centralPortal` by name, so that a plugin
        // module's `pluginMaven` publication and its marker both carry it. Central validates the
        // marker POM by the same rules as any other.
        publications.withType(MavenPublication).configureEach {
            pom {
                name = "CoordinateKit Foundation ${project.name}"
                description = moduleDescription
                url = findProperty("repoUrl")

                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }

                developers {
                    developer {
                        id = "andymarek"
                        name = "Andy Marek"
                        email = "andy@andymarek.com"
                    }
                }

                scm {
                    connection = "scm:git:git://github.com/coordinatekit/coordinatekit-foundation.git"
                    developerConnection = "scm:git:ssh://github.com/coordinatekit/coordinatekit-foundation.git"
                    url = findProperty("repoUrl")
                }
            }
        }
    }

    // Central rejects a deployment whose POM is missing name, description, url, a license, a
    // developer, or scm. The description in particular reaches the POM through a provider that
    // resolves late, so a wiring mistake surfaces as an empty element rather than a build failure.
    // `check` fails here instead, naming the element, long before the Portal sees it.
    //
    // Every generated POM is checked, not one named publication: a plugin module publishes its jar
    // and a marker, and a marker whose POM is short a required element fails the whole deployment.
    def modulePath = project.path
    def pomTasks = tasks.withType(GenerateMavenPom)
    def pomFiles = files({ pomTasks.collect { it.destination } }).builtBy(pomTasks)

    tasks.register("validatePom") {
        description = "Verify every generated POM carries the metadata Maven Central requires"
        group = "verification"

        inputs.files(pomFiles)

        doLast {
            pomFiles.each { pomFile ->
                // Not namespace-aware: the POM declares a default xmlns, and matching bare local
                // names keeps the lookups readable.
                def pom = new XmlSlurper(false, false).parse(pomFile)
                def missing = []
                def require = { String element, String value -> if (!value?.trim()) missing << element }

                require("groupId", pom.groupId.text())
                require("artifactId", pom.artifactId.text())
                require("version", pom.version.text())
                require("name", pom.name.text())
                require("description", pom.description.text())
                require("url", pom.url.text())
                require("licenses/license/name", pom.licenses.license.name.text())
                require("licenses/license/url", pom.licenses.license.url.text())
                require("developers/developer/name", pom.developers.developer.name.text())
                require("scm/url", pom.scm.url.text())
                require("scm/connection", pom.scm.connection.text())

                if (missing) {
                    throw new GradleException(
                            "${modulePath} POM is missing metadata Maven Central requires: ${missing.join(', ')} " +
                            "(see ${pomFile})")
                }
            }
        }
    }

    tasks.named("check") {
        dependsOn tasks.named("validatePom")
    }

    signing {
        String signingKey = findProperty("signingKey")
        String signingPassword = findProperty("signingPassword")
        if (signingKey) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        } else {
            useGpgCmd()
        }
        required = isPublishingToCentral
    }

    // Every publication is signed, for the same reason every POM is validated. `configureEach` also
    // covers publications registered later, such as the ones `java-gradle-plugin` creates in its own
    // `afterEvaluate`, so nothing here depends on which callback runs first.
    publishing.publications.configureEach {
        signing.sign(it)
    }

    tasks.withType(Sign).configureEach {
        onlyIf isPublishingToCentral
    }

    spotless {
        java {
            eclipse("4.21").configFile(rootProject.file("conventions/src/main/resources/org/coordinatekit/foundation/conventions/eclipse_java_coordinatekit.xml"))
            licenseHeaderFile rootProject.file("conventions/src/main/resources/org/coordinatekit/foundation/conventions/license_header.txt")
            target "src/**/*.java"
            trimTrailingWhitespace()
            toggleOffOn()
        }
    }
}

configure(codeProjects) {
    apply plugin: "jacoco"
    apply plugin: "net.ltgt.errorprone"

    dependencies {
        errorprone libs.errorprone.core

        api libs.jspecify

        testImplementation(platform(libs.junit.bom))
        testImplementation(libs.junit.jupiter)
        testRuntimeOnly(libs.junit.platform.launcher)
    }

    // Error Prone 2.48 refuses to run on JDK 21 without this javac option, and net.ltgt.errorprone
    // 4.1.0 does not pass it automatically.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += "-XDaddTypeAnnotationsToSymbol=true"
    }

    // Stamped on every module's jar rather than only on the one that reads it: it costs nothing,
    // and `concordance-gradle` resolves its own version from here through
    // `Package.getImplementationVersion()` so the plugin and the check it configures always come
    // from the same release.
    tasks.named("jar", Jar) {
        manifest {
            attributes("Implementation-Version": project.version)
        }
    }

    test {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
        doLast {
            def customCss = rootProject.file('.infra/jacoco-report.css')
            if (customCss.exists()) {
                copy {
                    from customCss
                    into reports.html.outputLocation.dir('jacoco-resources')
                    rename { 'report.css' }
                }
            }
        }
    }
}

// `conventions` publishes two resources and no classes, so javadoc exits with "No public or
// protected classes found to document" and would fail `build`. Its javadoc jar is empty by
// necessity; Central only requires that one exist. Every other module keeps javadoc's error
// reporting, and aggregateJavadoc layers -Werror on top — though it draws from codeProjects, so
// it never sees this module.
project(":conventions") {
    javadoc {
        failOnError = false
    }
}

// An Error Prone check is written against javac's own AST and symbol tables, which the jdk.compiler
// module does not export. Every other module compiles and documents without these; concordance-
// errorprone does neither with them missing, and its tests run javac in-process through
// CompilationTestHelper, so the same packages have to be open to the test JVM as well.
// aggregateJavadoc reads that module's sources too, which is why the list lives out here.
def javacExports = [
        "com.sun.tools.javac.api",
        "com.sun.tools.javac.code",
        "com.sun.tools.javac.comp",
        "com.sun.tools.javac.file",
        "com.sun.tools.javac.main",
        "com.sun.tools.javac.model",
        "com.sun.tools.javac.parser",
        "com.sun.tools.javac.processing",
        "com.sun.tools.javac.tree",
        "com.sun.tools.javac.util"
].collect { "jdk.compiler/${it}=ALL-UNNAMED" as String }

// Dogfooding: this repository's sources are checked against the rule its own AGENTS.md states, by
// the check in this repository rather than by a published release of it. The wiring is the raw
// -Xep flags rather than the concordance-gradle plugin, because that plugin resolves the check from
// Maven Central at its own version, which is the last release and not the working tree.
// concordance-errorprone itself is left out: a module cannot supply the check that compiles it.
configure(codeProjects.findAll { it.name != "concordance-errorprone" }) {
    dependencies {
        errorprone project(":concordance-errorprone")
    }

    tasks.withType(JavaCompile).configureEach {
        options.errorprone.check("Concordance", CheckSeverity.ERROR)
        options.errorprone.option("Concordance:ScaffoldingFieldTypes", "org.slf4j.Logger")
        options.errorprone.option("Concordance:LifecycleAnnotations", [
                "org.junit.jupiter.api.AfterAll",
                "org.junit.jupiter.api.AfterEach",
                "org.junit.jupiter.api.BeforeAll",
                "org.junit.jupiter.api.BeforeEach"
        ].join(","))
    }
}

project(":concordance-errorprone") {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += javacExports.collect { "--add-exports=${it}" as String }
    }

    javadoc {
        options.addMultilineStringsOption("-add-exports").value = javacExports
    }

    tasks.named("test", Test) {
        jvmArgs += javacExports.collect { "--add-exports=${it}" as String }
        jvmArgs += ["com.sun.tools.javac.code", "com.sun.tools.javac.comp"]
                .collect { "--add-opens=jdk.compiler/${it}=ALL-UNNAMED" as String }
    }
}

tasks.register('aggregateJacocoReport', JacocoReport) {
    description = "Generate aggregated JaCoCo coverage report for all modules"
    group = "verification"

    dependsOn codeProjects*.test

    executionData.from(codeProjects.collect {
        it.tasks.jacocoTestReport.executionData
    })

    sourceDirectories.from(codeProjects.collect {
        it.sourceSets.main.allSource.srcDirs
    })

    classDirectories.from(codeProjects.collect {
        it.sourceSets.main.output
    })

    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('aggregateJavadoc', Javadoc) {
    description = "Generate aggregated Javadoc for all modules"
    group = "documentation"

    source codeProjects.collect { it.sourceSets.main.allJava }
    classpath = files(codeProjects.collect { it.sourceSets.main.compileClasspath })

    options {
        title = "CoordinateKit Foundation ${project.version} API"
        windowTitle = "CoordinateKit Foundation API"
        links = [
                "https://docs.oracle.com/en/java/javase/21/docs/api/",
                "https://jspecify.dev/docs/api/"
        ]
        encoding = "UTF-8"
        docEncoding = "UTF-8"
        charSet = "UTF-8"

        // Name segments whose display form is not just the segment capitalised.
        def wordForms = ["api": "API", "cli": "CLI", "errorprone": "Error Prone"]

        // Each group's pattern ends in `*`, and javadoc puts a package in the first group that
        // matches it, so a module whose name prefixes another module's would swallow it:
        // `org.coordinatekit.foundation.concordance*` also matches the errorprone and gradle
        // packages. Registering the longest name first makes the most specific pattern win.
        codeProjects.toSorted { -it.name.length() }.each { subproject ->
            def pkgPattern = "${project.group}.${subproject.name.replace('-', '.')}*"
            def groupName = subproject.name.split('-')
                    .collect { wordForms.getOrDefault(it, it.capitalize()) }
                    .join(' ')
            //noinspection GroovyAssignabilityCheck, ForeignDelegate
            group("${groupName} Module", [pkgPattern])
        }

        addBooleanOption('Werror', true)

        // concordance-errorprone's sources name javac's own AST and symbol types, which the
        // jdk.compiler module does not export.
        addMultilineStringsOption("-add-exports").value = javacExports
    }
}
