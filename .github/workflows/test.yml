name: Test

on:
  pull_request:
    paths:
      - "**/src/**"
      - "**/*.gradle"
      - "gradle/**"
      - "gradlew*"
      - "README.md"
      - "RELEASE.md"
      - ".github/workflows/test.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test aggregateJacocoReport

      - name: Add coverage to PR
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: "build/reports/jacoco/aggregateJacocoReport/aggregateJacocoReport.xml"
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: "Code Coverage"
          update-comment: true

  mutation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Find changed classes
        id: changed
        shell: bash
        run: |
          classes=$(
            git diff --name-only --diff-filter=d HEAD^1 HEAD -- \
              '*/src/main/java/*.java' '*/src/test/java/*Test.java' \
              ':(exclude)*/package-info.java' ':(exclude)*/module-info.java' |
              while read -r path; do
                module=${path%%/src/*}
                class=${path#*/src/*/java/}
                class=${class%.java}
                case $path in (*/src/test/*) class=${class%Test} ;; esac
                [ -f "$module/src/main/java/$class.java" ] || continue
                printf '%s\n' "${class//\//.}"
              done |
              sort -u |
              paste -sd, -
          )
          echo "classes=$classes" >> "$GITHUB_OUTPUT"

      # Compiled first, so that only the mutation run is limited to one worker.
      - name: Compile
        if: steps.changed.outputs.classes != ''
        run: ./gradlew testClasses

      # One module at a time, so each pitest task has the runner's cores to itself.
      - name: Run mutation tests
        if: steps.changed.outputs.classes != ''
        run: ./gradlew pitest --max-workers=1 -Ppitest.targetClasses="$CLASSES"
        env:
          CLASSES: ${{ steps.changed.outputs.classes }}

      - name: Add mutation results to PR
        uses: coordinatekit/mutation-report@initial-implementation
