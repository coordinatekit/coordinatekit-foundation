[versions]
# api — update conservatively (security/bugs only)
archunit = "1.5.1"
jspecify = "1.0.0"

# provided — compileOnly, supplied by the consumer's build at run time. The published check and
# plugin are binary-coupled to these, so update conservatively and move README's "built against"
# line with them. The build section's unsuffixed versions of the same coordinates run this
# repository's own linting, so a current Error Prone exercises the check built against the target.
errorprone-target = "2.51.0"
errorprone-plugin-target = "5.2.0"

# implementation — keep current
gitchangelog-plugin = "3.4.2"
jgit = "7.8.1.202611041320-r"
jline = "4.7.0"
license-report = "3.1.5"
slf4j = "2.0.20"

# test — always latest
junit = "6.1.3"
picocli = "4.7.7"

# build — keep current
errorprone = "2.51.0"
errorprone-plugin = "5.2.0"
gradle-release = "3.2.0"
nmcp = "1.6.2"
pitest = "1.30.2"
pitest-junit5 = "1.2.3"
pitest-plugin = "1.19.0"
spotless = "8.11.0"
vanniktech-publish = "0.37.0"

[libraries]
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
errorprone-check-api = { module = "com.google.errorprone:error_prone_check_api", version.ref = "errorprone-target" }
# error_prone_core appears twice on purpose: errorprone-core runs this repository's own linting,
# errorprone-core-target runs ConcordanceTest against the version the check promises. They never
# share a configuration.
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
errorprone-core-target = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-target" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin-target" }
errorprone-test-helpers = { module = "com.google.errorprone:error_prone_test_helpers", version.ref = "errorprone-target" }
gitchangelog-gradle-plugin = { module = "se.bjurr.gitchangelog:git-changelog-gradle-plugin", version.ref = "gitchangelog-plugin" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
jline = { module = "org.jline:jline", version.ref = "jline" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
license-report-gradle-plugin = { module = "com.github.jk1:gradle-license-report", version.ref = "license-report" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
pitest-command-line = { module = "org.pitest:pitest-command-line", version.ref = "pitest" }
pitest-junit5-plugin = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
nmcp-aggregation = { id = "com.gradleup.nmcp.aggregation", version.ref = "nmcp" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin" }
release = { id = "net.researchgate.release", version.ref = "gradle-release" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-publish-base = { id = "com.vanniktech.maven.publish.base", version.ref = "vanniktech-publish" }
