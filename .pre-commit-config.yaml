default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        stages: [pre-commit]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-jsonschema
        name: Validate issue form templates
        files: ^\.github/ISSUE_TEMPLATE/(bug_report|feature_request|task)\.yml$
        args:
          [
            "--schemafile",
            "https://json.schemastore.org/github-issue-forms.json",
          ]
      - id: check-jsonschema
        name: Validate issue template config
        files: ^\.github/ISSUE_TEMPLATE/config\.yml$
        args:
          [
            "--schemafile",
            "https://json.schemastore.org/github-issue-config.json",
          ]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]
  - repo: local
    hooks:
      - id: spotless-apply
        name: Spotless Apply
        entry: ./gradlew spotlessApply
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: check
        name: Check
        entry: ./gradlew check
        language: system
        pass_filenames: false
        stages: [pre-commit]
