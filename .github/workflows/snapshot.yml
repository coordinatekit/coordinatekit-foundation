name: Snapshot

on:
  push:
    branches: ["main"]
    paths:
      - "**/src/**"
      - "**/*.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew*"
      - ".github/workflows/snapshot.yml"

concurrency:
  group: snapshot-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read project version
        id: version
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ -z "$VERSION" ]; then
            echo "Error: could not read version from gradle.properties" >&2
            exit 1
          fi
          echo "Project version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build

      - name: Publish snapshots to Central Portal
        if: endsWith(steps.version.outputs.version, '-SNAPSHOT')
        run: ./gradlew publishAggregationToCentralSnapshots
        env:
          ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.SONATYPE_PASSWORD }}
