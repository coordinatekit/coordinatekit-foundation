// Compiles the sources of the plugin modules this repository applies to itself, so that the root
// build uses them as they stand in the working tree rather than as last released. The sources stay
// in the real modules, where Spotless, Error Prone, and the tests still check them; this build only
// compiles a second copy.
//
// changelog-gradle is registered as a plugin under its id, because the root build applies it from
// its `plugins` block, and a release pull request regenerates CHANGELOG.md with the template that
// pull request ships. aggregate-javadoc-gradle and version-references-gradle are applied by class,
// so their sources are only added to compileJava, through its sources and not a source set, so
// IntelliJ does not see the same directories as two content roots. aggregate-javadoc-gradle may use
// only the Gradle API and JSpecify, which is all this build gives it; version-references-gradle is
// the one that also needs JGit, to list the files Git tracks.
plugins {
    id "java-gradle-plugin"
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

sourceSets {
    main {
        java.srcDir "../changelog-gradle/src/main/java"
        resources.srcDir "../changelog-gradle/src/main/resources"
    }
}

gradlePlugin {
    plugins {
        changelog {
            id = "org.coordinatekit.foundation.changelog"
            implementationClass = "org.coordinatekit.foundation.changelog.gradle.ChangelogPlugin"
        }
    }
}

dependencies {
    implementation libs.gitchangelog.gradle.plugin
    implementation libs.jgit
    compileOnly libs.jspecify
}

tasks.named("compileJava", JavaCompile) {
    source(files(
            "../aggregate-javadoc-gradle/src/main/java",
            "../version-references-gradle/src/main/java"))
}
