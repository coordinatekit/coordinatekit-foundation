name: Test

on:
  pull_request:
    paths:
      - "**/src/**"
      - "**/*.gradle"
      - "gradle/**"
      - "gradlew*"
      - "README.md"
      - "RELEASE.md"
      - ".github/workflows/test.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test aggregateJacocoReport

      - name: Add coverage to PR
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: "build/reports/jacoco/aggregateJacocoReport/aggregateJacocoReport.xml"
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: "Code Coverage"
          update-comment: true

  mutation:
    runs-on: ubuntu-latest

    # Job-level permissions replace the workflow's, so the two it needs from there are repeated.
    permissions:
      contents: read
      pull-requests: write
      checks: write # the report action creates a check run

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Find changed classes
        id: changed
        shell: bash
        run: |
          classes=$(
            git diff --name-only --diff-filter=d HEAD^1 HEAD -- \
              '*/src/main/java/*.java' '*/src/test/java/*Test.java' \
              ':(exclude)*/package-info.java' ':(exclude)*/module-info.java' |
              while read -r path; do
                module=${path%%/src/*}
                class=${path#*/src/*/java/}
                class=${class%.java}
                case $path in (*/src/test/*) class=${class%Test} ;; esac
                [ -f "$module/src/main/java/$class.java" ] || continue
                printf '%s\n' "${class//\//.}"
              done |
              sort -u |
              paste -sd, -
          )
          echo "classes=$classes" >> "$GITHUB_OUTPUT"

      # Compiled first, so that only the mutation run is limited to one worker.
      - name: Compile
        if: steps.changed.outputs.classes != ''
        run: ./gradlew testClasses

      # One module at a time, so each pitest task has the runner's cores to itself.
      - name: Run mutation tests
        if: steps.changed.outputs.classes != ''
        run: ./gradlew pitest --max-workers=1 -Ppitest.targetClasses="$CLASSES"
        env:
          CLASSES: ${{ steps.changed.outputs.classes }}

      - name: Publish mutation report
        if: hashFiles('**/build/reports/pitest/mutations.xml') != ''
        uses: Bonajo/pitest-report-action@v1.3.2
        with:
          name: Pitest report
          file: "**/build/reports/pitest/mutations.xml"
          summary: false
          max-annotations: 50

      # The action's table exists only in its check run, which it attaches to the PR head commit.
      - name: Build mutation comment
        run: |
          {
            printf '## Mutation Testing\n\n'
            if [ -z "$CLASSES" ]; then
              echo 'No changed classes to mutate.'
            elif [ "$HAS_REPORT" != true ]; then
              echo 'The changed classes have nothing to mutate.'
            else
              gh api --method GET "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs" \
                -f check_name="$CHECK_NAME" \
                --jq '.check_runs | max_by(.completed_at) | .output.summary'
            fi
          } > pitest-comment.md
        env:
          CHECK_NAME: Pitest report
          CLASSES: ${{ steps.changed.outputs.classes }}
          GH_TOKEN: ${{ github.token }}
          HAS_REPORT: ${{ hashFiles('**/build/reports/pitest/mutations.xml') != '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}

      - name: Add mutation results to PR
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: pitest
          path: pitest-comment.md
